# Conda environment for training on an NVIDIA GPU (tested target: RTX 4090, driver >= 550).
#   conda env create -f environment.yml
#   conda activate asmoe
# PyTorch comes from the official CUDA 12.4 wheel index (bundles CUDA + cuDNN; no system CUDA toolkit needed).
name: asmoe
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      - torchvision==0.20.1
      - timm>=1.0.9
      - numpy>=1.24
      - pandas>=2.0
      - scikit-learn>=1.3
      - pillow>=10.0
      - pyyaml>=6.0
      - matplotlib>=3.7
      - nbformat>=5.9
      - kaggle>=1.6
