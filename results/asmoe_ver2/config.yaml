data:
  root: /workspace/data/Potato Leaf Disease Dataset in Uncontrolled Environment
  cache_dir: /workspace/cache
  cache_max_side: 640
  image_size: 512
  roi_crop: true
  roi_margin: 0.08
  drop_conflicting_duplicates: true
  dedupe_exact: true
  near_dup_threshold: 2
  drop_cross_label_near_dups: true
  n_folds: 5
  fold_seed: 42
  num_workers: 8
  hflip: 0.5
  vflip: 0.5
  rotation: 20
  affine_translate: 0.05
  affine_scale:
  - 0.9
  - 1.1
  affine_shear: 5.0
  brightness: 0.15
  contrast: 0.15
  mixup_alpha: 0.2
  mixup_prob: 0.5
model:
  arch: asmoe
  experts:
  - name: densenet201.tv_in1k
    role: local-texture
    image_size: 512
    pretrained: true
    grad_checkpointing: false
    kwargs: {}
  - name: tf_efficientnetv2_m.in21k_ft_in1k
    role: multi-scale
    image_size: 480
    pretrained: true
    grad_checkpointing: false
    kwargs: {}
  - name: swin_base_patch4_window12_384.ms_in22k_ft_in1k
    role: global-attention
    image_size: 384
    pretrained: true
    grad_checkpointing: false
    kwargs: {}
  proj_dim: 512
  router_hidden: 256
  router_mode: adaptive
  router_temperature: 1.0
  router_dropout: 0.1
  head_dropout: 0.2
  supcon_dim: 128
train:
  output_dir: outputs
  seed: 42
  batch_size: 8
  grad_accum: 4
  amp: true
  channels_last: true
  gpu_probe: true
  stage1_epochs: 5
  stage2_epochs: 40
  lr_backbone: 1.0e-05
  lr_head: 0.0003
  weight_decay: 0.05
  warmup_epochs: 2
  patience: 8
  label_smoothing: 0.05
  loss: ce
  focal_gamma: 2.0
  class_weight: sqrt
  supcon_weight: 0.1
  supcon_temperature: 0.07
  balance_weight: 0.01
  ema_decay: 0.999
  tta: true
  clip_grad: 1.0
  save_resume: true
  time_budget_hours: 4
overleaf:
  git_url: https://git.overleaf.com/6ae6eb411f26b6a0c2f760f8
  local_dir: outputs/overleaf_repo
  paper_dir: paper
  branch: master
  auto_push: false
experiment_name: asmoe_v2
class_names:
- Bacteria
- Fungi
- Healthy
- Nematode
- Pest
- Phytopthora
- Virus
